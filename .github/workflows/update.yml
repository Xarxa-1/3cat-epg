name: Actualitzar EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  actualitzar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositori
        uses: actions/checkout@v4

      - name: Instal·lar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generar EPG
        run: python update_epg.py

      - name: Publicar canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.json

          if git diff --cached --quiet; then
            echo "No hi ha canvis"
          else
            git commit -m "Actualitzar EPG"
            git push
          fi
